{% extends "base.html" %}
{% block title %}Publish — {{ site_name }}{% endblock %}

{% block content %}
<section>
  <div class="wrap" style="max-width: 640px;">
    <h1 style="font-size: 2.2rem;">Publish a new episode</h1>
    <p class="lede">Fills straight into the episode library — it'll show up on
      the Episodes page and the homepage immediately.</p>

    <form method="post" action="{{ url_for('upload') }}" style="margin-top: 28px;"{% if static_export %} data-static-form="Publish"{% endif %}>
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Where the trail almost won" required>
      </div>

      <div class="field">
        <label for="category">Series</label>
        <input type="text" id="category" name="category" placeholder="Hiking, Van Life, Food…" required>
      </div>

      <div class="field">
        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="Torres del Paine, Chile">
      </div>

      <div class="field">
        <label for="duration">Duration</label>
        <input type="text" id="duration" name="duration" placeholder="14:20">
      </div>

      <div class="field">
        <label for="youtube_id">YouTube video ID</label>
        <input type="text" id="youtube_id" name="youtube_id" placeholder="dQw4w9WgXcQ">
      </div>

      <div class="field">
        <label for="thumbnail">Thumbnail URL</label>
        <input type="text" id="thumbnail" name="thumbnail" placeholder="https://…">
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" placeholder="What happened, where, and why it's worth eleven minutes." required></textarea>
      </div>

      <button class="btn btn-primary" type="submit">Publish episode</button>
    </form>
  </div>
</section>
{% endblock %}
